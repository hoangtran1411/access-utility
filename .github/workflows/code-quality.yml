name: Code Quality & Security

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC

jobs:
  code-quality:
    name: Lint, Format & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AccessUtility.slnx

      - name: Check Code Formatting
        run: dotnet format AccessUtility.slnx --verify-no-changes --verbosity normal || true

      - name: Check NuGet Vulnerabilities
        run: dotnet list AccessUtility.slnx package --vulnerable --include-transitive

      - name: Build with Warnings as Errors Check
        run: dotnet build AccessUtility.slnx --configuration Release --no-restore

      - name: Execute Test Suite with Code Coverage
        run: dotnet test AccessUtility.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
