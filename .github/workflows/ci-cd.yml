name: AccessUtility CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AccessUtility.slnx

      - name: Build Solution (Release)
        run: dotnet build AccessUtility.slnx --configuration Release --no-restore

      - name: Execute xUnit Unit Tests
        run: dotnet test AccessUtility.slnx --configuration Release --no-build --verbosity normal

  publish-native-aot:
    name: Publish Native AOT (${{ matrix.os }} / ${{ matrix.rid }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary_name: AccessUtility.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary_name: AccessUtility
          - os: macos-latest
            rid: osx-arm64
            binary_name: AccessUtility

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT Executable
        run: |
          dotnet publish AccessUtility.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o ./publish-${{ matrix.rid }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessUtility-${{ matrix.rid }}
          path: ./publish-${{ matrix.rid }}/${{ matrix.binary_name }}

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-native-aot
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Native AOT Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Zip Artifacts for Release
        run: |
          cd ./artifacts
          zip -j AccessUtility-win-x64.zip AccessUtility-win-x64/*
          tar -czf AccessUtility-linux-x64.tar.gz -C AccessUtility-linux-x64 .
          tar -czf AccessUtility-osx-arm64.tar.gz -C AccessUtility-osx-arm64 .

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/AccessUtility-win-x64.zip
            ./artifacts/AccessUtility-linux-x64.tar.gz
            ./artifacts/AccessUtility-osx-arm64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
